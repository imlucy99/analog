<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Speedometer HUD</title>
  <meta name="description" content="Klaster analog JGVRP: tachometer (rev limiter needle shake), speedometer MPH, fuel, oil press (dari health), dan lampu indikator." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Opsional: override konfigurasi tanpa menyentuh script.js, mis.
  <script>window.HUD_CONFIG = { revLimit: 7500, limiterShakeAmplitude: 2.5 };</script> -->
</head>
<body>

  <!-- Tombol ganti tema: hanya tampil di preview browser atau di game lewat ?button. Shortcut: tekan T -->
  <button class="theme-btn" id="theme-btn" type="button" title="Ganti tema jarum (T)"><i></i><span id="theme-name">Merah Klasik</span></button>

  <div class="hud-wrap">
    <div class="cluster" id="hud">

      <!-- Bezel, skala, angka, jarum, odometer & lampu digambar oleh script.js (satu sistem koordinat viewBox 1600x700) -->
      <svg id="dial" class="dial" viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>

    </div>
  </div>

  <!-- Data lama yang tidak ditampilkan di desain baru (gear, suhu, jam) tetap diterima API-nya -->
  <div class="legacy" hidden>
    <span id="gear">N</span>
    <span id="temp-val">28</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
